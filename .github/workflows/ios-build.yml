name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # macos-13 has massive capacity on GitHub, picking up instantly without queuing
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.2.app || true
          xcodebuild -version

      - name: Fast Compile iOS App
        run: |
          cd AegisSecurity-iOS
          xcodebuild \
            -project AegisSecurity.xcodeproj \
            -scheme AegisSecurity \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Fast Package into IPA
        run: |
          cd AegisSecurity-iOS
          APP_PATH=$(find build -name "AegisSecurity.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: AegisSecurity.app not found!"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr AegisSecurity.ipa Payload
          mkdir -p ../output
          mv AegisSecurity.ipa ../output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisSecurity-iOS-IPA
          path: output/AegisSecurity.ipa
          retention-days: 7
